[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrysem"
version = "1.0.0"
description = "Reliable semantic cache reuse after noisy candidate search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Hossein Ahmadi"},
  {name = "Zahra Ziar"},
  {name = "Ali Kuhestani"}
]
keywords = [
  "semantic communication",
  "semantic caching",
  "post-selection inference",
  "random hyperplane sketching"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "matplotlib==3.10.1",
  "Pillow==11.2.1",
  "reportlab==4.3.1",
  "pypdf==5.3.1",
  "pypdfium2==5.13.0"
]

[project.optional-dependencies]
raw = [
  "torch==2.6.0",
  "torchvision==0.21.0"
]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "ruff==0.9.10"
]

[project.urls]
Repository = "https://github.com/HosseinAhmadi63/SentrySem-Semantic-Cache-Reuse"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"scripts/*.py" = ["E402"]
